name: Release mobile

# Publie l'APK Android sur un tag `vX.Y.Z`, avec la même logique que le
# desktop : le tag doit correspondre à la version du pubspec, sinon
# l'installeur publié ne serait jamais proposé par l'updater.
#
# Déclenchement : push d'un tag `v1.0.0` (le numéro de build `+N` reste
# dans le nom de la release) ou lancement manuel.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag à publier (ex. v1.0.0)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build + publication APK
    runs-on: ubuntu-latest
    steps:
      # Historique et tags complets : les notes de version comparent le tag
      # publié au précédent. Avec la profondeur 1 par défaut, `git tag` est
      # vide et `git log` ne voit qu'un commit.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Le runner a un JDK 25 par défaut : Gradle 8.14 ne sait pas l'exécuter
      # et le build meurt en 20 s sur une erreur de classe. Le poste de dev
      # compile en 17, on aligne la CI dessus plutôt que l'inverse.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Version épinglée identique à mobile-ci.yml : une release doit sortir
      # du même compilateur que la CI qui l'a validée.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.3
          channel: stable
          cache: true

      - name: Vérifier tag == version
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          RAW=$(grep -m1 '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//')
          VERSION="${RAW%%+*}"
          BUILD="${RAW#*+}"
          echo "tag=$TAG version=$VERSION build=$BUILD"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Le tag $TAG ne correspond pas à la version $VERSION du pubspec"
            exit 1
          fi
          echo "BUILD=$BUILD" >> "$GITHUB_ENV"

      - run: flutter pub get

      # Les traductions générées sont suivies : si l'ARB a bougé sans
      # régénération, l'APK partirait avec des libellés périmés.
      - name: Vérifier les traductions générées
        shell: bash
        run: |
          flutter gen-l10n
          if ! git diff --quiet -- lib/l10n/generated; then
            echo "::error::lib/l10n/generated n'est pas à jour — lancer flutter gen-l10n"
            git diff --stat -- lib/l10n/generated
            exit 1
          fi

      - run: flutter analyze

      # flutter doctor signale des licences non acceptées sur l'image : Gradle
      # refuse alors d'installer la moindre plateforme manquante.
      - name: Licences Android
        shell: bash
        run: yes | flutter doctor --android-licenses > /dev/null 2>&1 || true

      # La clé de signature n'est pas dans le dépôt, et ne doit jamais y être.
      # Sans elle, Gradle retombe sur la clé de debug : l'APK s'installe, mais
      # la signature change à chaque build et Android refuse alors la mise à
      # jour par-dessus la version précédente.
      - name: Préparer la clé de signature
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning title=Signature::KEYSTORE_BASE64 absent — APK signé en debug, mises à jour impossibles."
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/tonde-release.jks"
          {
            echo "TONDE_KEYSTORE_PATH=$RUNNER_TEMP/tonde-release.jks"
            echo "TONDE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "TONDE_KEY_ALIAS=$KEY_ALIAS"
            echo "TONDE_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "Clé de signature préparée : $(stat -c%s "$RUNNER_TEMP/tonde-release.jks") octets."

      # Le canal natif (sonnerie, widget) ne se valide qu'en compilant.
      #
      # L'échec est remonté en annotation : les journaux d'un job ne sont
      # lisibles qu'avec un jeton, alors qu'une annotation est publique. Sans
      # cela, un build cassé ne laisse qu'un « exit code 1 ».
      - name: Build APK release
        shell: bash
        env:
          # Sans cette valeur, `apiRoot` est nul et le client HTTP part avec une
          # base vide : l'application s'ouvre, mais **aucune requête n'aboutit**
          # et la connexion échoue sans explication. Le défaut reprend l'URL du
          # backend pilote, la même que celle du desktop ; la variable de dépôt
          # permet de la changer sans toucher au code.
          TONDE_API_BASE_URL: ${{ vars.TONDE_API_BASE_URL || 'https://tonde-api-bdi.onrender.com' }}
        run: |
          set -o pipefail
          echo "API ciblée par cet APK : $TONDE_API_BASE_URL"
          if ! flutter build apk --release --verbose \
            --dart-define=TONDE_ENVIRONMENT=prod \
            --dart-define=TONDE_API_BASE_URL="$TONDE_API_BASE_URL" \
            2>&1 | tee build-apk.log; then
            # Gradle met la cause dans « What went wrong », loin de la pile
            # d'appels qui termine le journal.
            MSG=$(grep -A 12 "What went wrong" build-apk.log | tr '\n' '|' | sed 's/%/%25/g; s/\r//g' | cut -c1-3000)
            if [ -z "$MSG" ]; then
              MSG=$(tail -c 2500 build-apk.log | tr '\n' '|' | sed 's/%/%25/g; s/\r//g')
            fi
            echo "::error title=Build APK::${MSG}"
            exit 1
          fi

      - name: Diagnostic de l'environnement
        if: failure()
        shell: bash
        run: |
          OUT=$(flutter doctor -v 2>&1 | head -45 | tr '\n' '|' | sed 's/%/%25/g; s/\r//g')
          echo "::warning title=flutter doctor::${OUT}"

      - name: Nommer l'artefact
        shell: bash
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
             "dist/tonde-${{ github.event.inputs.tag || github.ref_name }}+${BUILD}.apk"
          ls -lh dist/

      # Les commits depuis le tag précédent, sans le bruit de fusion : c'est
      # ce que le client doit lire, pas un journal technique.
      - name: Notes de version
        id: notes
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          # `grep` sort en code 1 quand il ne sélectionne rien, et GitHub
          # exécute les étapes en `pipefail` : sans le `|| true`, un dépôt
          # sans tag précédent fait échouer la publication alors que le
          # binaire est déjà construit.
          PREV=$(git tag --sort=-creatordate | grep -vx "$TAG" | head -1 || true)
          if [ -n "$PREV" ]; then
            RANGE="$PREV..HEAD"
            ENTETE="Depuis $PREV :"
          else
            RANGE="HEAD"
            ENTETE="Première version publiée :"
          fi
          CORPS=$(git log "$RANGE" --no-merges --pretty='- %s' --reverse \
            | grep -v '^- ci' | head -40 || true)
          if [ -n "${TONDE_KEYSTORE_PATH:-}" ]; then
            SIGNATURE="Signature : clé de release TONDE — les mises à jour s'installent"
            SIGNATURE="$SIGNATURE par-dessus la version précédente."
          else
            SIGNATURE="Signature : clé de debug — les mises à jour ne s'installeront"
            SIGNATURE="$SIGNATURE pas par-dessus une version précédente."
          fi
          {
            echo "body<<NOTES"
            echo "APK Android (build ${BUILD})."
            echo
            echo "$ENTETE"
            echo
            echo "${CORPS:-- pas de changement fonctionnel}"
            echo
            echo "Installation : ouvrir le fichier sur le téléphone, autoriser"
            echo "l'installation depuis cette source si Android le demande."
            echo
            echo "$SIGNATURE"
            echo "NOTES"
          } >> "$GITHUB_OUTPUT"
          {
            echo "short<<SHORT"
            echo "${CORPS:-- pas de changement fonctionnel}"
            echo "SHORT"
          } >> "$GITHUB_OUTPUT"

      - name: Publier la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: "TONDE Mobile ${{ github.event.inputs.tag || github.ref_name }}+${{ env.BUILD }}"
          body: ${{ steps.notes.outputs.body }}
          files: dist/*.apk
          fail_on_unmatched_files: true
          draft: false
          prerelease: false

      # Distribution directe à l'équipe, sans téléchargement manuel de l'APK.
      # Volontairement après la publication GitHub : si Firebase échoue, le
      # binaire reste disponible et installable.
      #
      # Désactivé tant que le secret n'est pas posé, pour qu'un fork ou une
      # release sans Firebase reste verte.
      - name: Vérifier la configuration de distribution
        id: distribution
        shell: bash
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_SA" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=App Distribution::FIREBASE_SERVICE_ACCOUNT_JSON absent — distribution ignorée."
          fi

      - name: Distribuer via Firebase App Distribution
        if: steps.distribution.outputs.enabled == 'true'
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: 1:344689943913:android:1f9f495606403d810fc9f8
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          groups: equipe-terrain
          file: dist/tonde-${{ github.event.inputs.tag || github.ref_name }}+${{ env.BUILD }}.apk
          releaseNotes: ${{ steps.notes.outputs.short }}
