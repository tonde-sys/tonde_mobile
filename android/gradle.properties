# 8 Go de tas étaient demandés : sur un poste à 16 Go, la JVM et le daemon
# Kotlin se disputent la mémoire et le daemon Gradle finit par disparaître en
# plein build (« Gradle build daemon disappeared unexpectedly »). 4 Go suffisent
# largement pour cette application et laissent de la place au reste.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Désactiver la compilation incrémentale Kotlin : le projet est sur D: et le
# Pub Cache sur C:, ce qui provoque un crash du daemon Kotlin
# (IllegalArgumentException: different roots) à la fermeture des caches.
kotlin.incremental=false

# Le poste sort par un proxy local : sans ces lignes, Gradle tente un TLS direct
# vers dl.google.com / repo.maven.apache.org et le handshake est coupé.
# systemProp.http.proxyHost=127.0.0.1   (proxy local inactif : accès direct)
# systemProp.http.proxyPort=62835   (proxy local inactif : accès direct)
# systemProp.https.proxyHost=127.0.0.1   (proxy local inactif : accès direct)
# systemProp.https.proxyPort=62835   (proxy local inactif : accès direct)
# systemProp.http.nonProxyHosts=localhost|127.0.0.1   (proxy local inactif : accès direct)
